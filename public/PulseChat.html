<style>/* ============================================================
   PulseChat — application stylesheet
   Mobile-first messenger UI, dark & light themes via CSS vars.
   ============================================================ */

/* ---------- theme variables ---------- */
:root {
  --primary: #5b5fef;
  --primary-soft: rgba(91, 95, 239, 0.16);
  --accent: #22d3ee;
  --gradient: linear-gradient(135deg, #5b5fef 0%, #22d3ee 100%);
  --gradient-soft: linear-gradient(135deg, rgba(91,95,239,.18), rgba(34,211,238,.14));
  --online: #22c55e;
  --danger: #ef4444;
  --warn: #f59e0b;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(2, 4, 20, 0.35);
  --shadow-sm: 0 4px 14px rgba(2, 4, 20, 0.22);
  --nav-h: 60px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

:root[data-theme="dark"] {
  --bg: #0b0e1a;
  --bg-2: #0e1222;
  --surface: #141a30;
  --surface-2: #1a2140;
  --surface-3: #232c52;
  --text: #eef1ff;
  --text-dim: #9aa3c7;
  --text-faint: #6b739c;
  --border: rgba(255, 255, 255, 0.08);
  --bubble-in: #1c2344;
  --bubble-in-text: #dde3ff;
  --input-bg: #0f1428;
  --danger-soft: rgba(239, 68, 68, 0.15);
  --online-soft: rgba(34, 197, 94, 0.15);
  --read-color: #7dd3fc;
  --chat-bg: #0b0e1a;
  --overlay: rgba(4, 6, 18, 0.72);
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #f3f5fb;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f0f2fa;
  --surface-3: #e6e9f5;
  --text: #131633;
  --text-dim: #5c648a;
  --text-faint: #8b93b8;
  --border: rgba(19, 22, 51, 0.1);
  --bubble-in: #eef0fa;
  --bubble-in-text: #1a1e3d;
  --input-bg: #eef0f8;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --online-soft: rgba(34, 197, 94, 0.14);
  --read-color: #2b8ce0;
  --chat-bg: #eef1f9;
  --overlay: rgba(15, 18, 42, 0.5);
  color-scheme: light;
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
img { display: block; max-width: 100%; }
::placeholder { color: var(--text-faint); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

#app { height: 100vh; height: 100dvh; }
.hidden { display: none !important; }

/* ---------- generic elements ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
  transition: transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .2s;
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--gradient); color: #fff; box-shadow: 0 6px 18px rgba(91,95,239,.35); }
.btn-primary:hover { box-shadow: 0 8px 24px rgba(91,95,239,.5); }
.btn-ghost { background: var(--surface-2); color: var(--text); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--online); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 13.5px; }
.btn-lg { padding: 14px 26px; font-size: 16px; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-dim); transition: background .2s, color .2s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 22px; height: 22px; }

.input {
  width: 100%; padding: 13px 16px; border-radius: var(--radius);
  background: var(--input-bg); border: 1.5px solid transparent;
  font-size: 15px; outline: none; transition: border .2s, background .2s;
}
.input:focus { border-color: var(--primary); background: var(--surface); }
.input.invalid { border-color: var(--danger); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 7px; }
.error-text { color: var(--danger); font-size: 13px; margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
.form-error {
  background: var(--danger-soft); color: var(--danger); border-radius: var(--radius);
  padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.45;
}
.form-ok {
  background: var(--online-soft); color: var(--online); border-radius: var(--radius);
  padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.45;
}

.avatar {
  border-radius: 50%; object-fit: cover; background: var(--surface-3);
  flex: none; overflow: hidden; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; user-select: none;
}
.avatar::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset 0 0 0 1px var(--border);
}
.avatar-sm { width: 40px; height: 40px; font-size: 16px; }
.avatar-xs { width: 28px; height: 28px; font-size: 12px; }
.avatar-md { width: 52px; height: 52px; font-size: 20px; }
.avatar-lg { width: 84px; height: 84px; font-size: 32px; }
.avatar-xl { width: 110px; height: 110px; font-size: 42px; }

.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--gradient); color: #fff; font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot-online { background: var(--online); box-shadow: 0 0 0 3px var(--online-soft); }
.dot-offline { background: var(--text-faint); }

.spinner {
  width: 22px; height: 22px; border-radius: 50%;
  border: 3px solid var(--surface-3); border-top-color: var(--primary);
  animation: spin .8s linear infinite; margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.center-fill { display: flex; align-items: center; justify-content: center; height: 100%; }
.empty-state { text-align: center; padding: 40px 24px; color: var(--text-dim); }
.empty-state.minimal { padding: 28px 20px; }
.empty-state.minimal p { font-size: 13.5px; line-height: 1.6; margin: 0; color: var(--text-faint); }
.empty-state .empty-icon { width: 72px; height: 72px; margin: 0 auto 18px; opacity: .85; }
.empty-state h3 { color: var(--text); font-size: 17px; margin-bottom: 6px; }

/* ---- animated worm mascot (mobile empty state + desktop panel) ---- */
.worm-stage { position: relative; width: 250px; height: 240px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
.worm-logo {
  width: 150px; height: 150px; border-radius: 42px; position: relative; z-index: 2;
  box-shadow: 0 18px 55px rgba(255, 77, 109, .5), 0 0 0 8px rgba(255, 77, 109, .15);
  animation: wormBreathe 3.2s ease-in-out infinite;
}
@keyframes wormBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.worm-rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.worm-ring {
  position: absolute; width: 168px; height: 168px; border-radius: 50%;
  border: 3px solid rgba(255, 77, 109, .5);
  animation: wormRing 3s cubic-bezier(.2,.6,.35,1) infinite;
}
.worm-ring:nth-child(2) { animation-delay: 1s; }
.worm-ring:nth-child(3) { animation-delay: 2s; }
@keyframes wormRing { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.9); opacity: 0; } }
.worm-ekg { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 1; }
.worm-ekg svg { width: 210px; height: 36px; }
.worm-ekg path {
  fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 520; stroke-dashoffset: 520;
  animation: wormEkg 3.2s linear infinite;
  filter: drop-shadow(0 0 6px rgba(34,211,238,.6));
}
@keyframes wormEkg {
  0%   { stroke-dashoffset: 520; }
  55%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -520; }
}

/* Mobile: keep the pulse big and centered on small screens too */
@media (max-width: 480px) {
  .worm-stage { width: 220px; height: 210px; margin-bottom: 8px; }
  .worm-logo { width: 130px; height: 130px; border-radius: 36px; }
  .worm-ring { width: 148px; height: 148px; }
  .worm-ekg svg { width: 190px; height: 32px; }
  .empty-state { padding: 30px 16px; }
}
.empty-state p { font-size: 14px; line-height: 1.55; margin-bottom: 18px; }
.empty-steps { text-align: left; max-width: 260px; margin: 0 auto 18px; display: flex; flex-direction: column; gap: 9px; }
.empty-step { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dim); }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--gradient); color: #fff;
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none;
}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
.auth-wrap {
  height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(600px 400px at 15% -5%, rgba(91,95,239,.28), transparent 60%),
    radial-gradient(600px 420px at 105% 110%, rgba(34,211,238,.18), transparent 60%),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 24px;
  padding: 30px 26px; box-shadow: var(--shadow);
  animation: rise .35s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.auth-brand .logo { width: 46px; height: 46px; }
.auth-brand h1 { font-size: 22px; letter-spacing: -.3px; }
.auth-brand p { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.auth-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 999px; margin-bottom: 22px; }
.auth-tabs button { flex: 1; padding: 9px 0; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-dim); transition: all .2s; }
.auth-tabs button.active { background: var(--gradient); color: #fff; box-shadow: var(--shadow-sm); }
.dev-reset svg { width: 14px; height: 14px; }
.dev-reset:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

.auth-alt { text-align: center; font-size: 13.5px; color: var(--text-dim); margin-top: 18px; }
.auth-alt a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }
.auth-alt a:hover { text-decoration: underline; }

/* Animated worm background — absolute, behind everything, never takes space */
.shell { display: flex; height: 100%; }
.col-list { width: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; flex: 1 1 0; min-height: 0; }
.bg-pulse {
  position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.bg-pulse-stage { position: relative; width: 230px; height: 200px; opacity: .8; }
.bg-pulse-logo {
  width: 108px; height: 108px; border-radius: 30px; position: relative; z-index: 2;
  box-shadow: 0 18px 50px rgba(255, 77, 109, .55), 0 0 0 6px rgba(255, 77, 109, .18);
  animation: wormBreathe 3.6s ease-in-out infinite;
}
.bg-pulse-rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.bg-pulse-ring {
  position: absolute; width: 126px; height: 126px; border-radius: 50%;
  border: 3px solid rgba(255, 77, 109, .65);
  animation: wormRing 3.6s cubic-bezier(.2,.6,.35,1) infinite;
}
.bg-pulse-ring:nth-child(2) { animation-delay: 1.2s; }
.bg-pulse-ring:nth-child(3) { animation-delay: 2.4s; }
.bg-pulse-ekg { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
.bg-pulse-ekg svg { width: 230px; height: 40px; }
.bg-pulse-ekg path {
  fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 520; stroke-dashoffset: 520;
  animation: wormEkg 3.6s linear infinite;
  filter: drop-shadow(0 0 10px rgba(34, 211, 238, .8));
}

/* Keep interactive content above the background */
.list-header, .tabs, .tab-content, .chat, .chat-empty { position: relative; z-index: 1; }

.col-chat {
  display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 40; background: var(--chat-bg);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  visibility: hidden; pointer-events: none;
}
.col-chat.open { transform: translateX(0); visibility: visible; pointer-events: auto; }

.list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; gap: 10px;
  position: sticky; top: 0; z-index: 5; background: var(--bg);
}
.list-header .brand { display: flex; align-items: center; gap: 10px; }
.list-header .brand img { width: 34px; height: 34px; }
.header-logout { width: 36px; height: 36px; }
.header-logout:hover { background: var(--danger-soft); color: var(--danger); }
.header-logout svg { width: 19px; height: 19px; }
.list-header .brand h1 { font-size: 19px; letter-spacing: -.3px; }
.conn-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim);
}
.conn-pill .dot { width: 8px; height: 8px; }
.conn-pill.connected .dot { background: var(--online); }
.conn-pill.connecting .dot { background: var(--warn); animation: pulse 1.2s infinite; }
.conn-pill.offline .dot { background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }

.tabs {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  padding: 6px 12px 10px;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 0 5px; border-radius: var(--radius); color: var(--text-dim);
  font-size: 11px; font-weight: 600; position: relative; transition: color .2s, background .2s;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--primary); background: var(--primary-soft); }
.tab .badge {
  position: absolute; top: 1px; left: 55%; min-width: 17px; height: 17px;
  font-size: 10px; padding: 0 4px;
}
.tab .badge.hidden { display: none; }

.tab-content { flex: 1 1 0; overflow-y: auto; padding: 0 12px 90px; min-height: 0; -webkit-overflow-scrolling: touch; }

/* ---------- bottom nav (mobile) ---------- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav .tab { padding: 9px 0 7px; border-radius: 0; }
.bottom-nav .tab.active { background: transparent; }

/* ============================================================
   CHAT LIST
   ============================================================ */
.conv-list { display: flex; flex-direction: column; gap: 2px; }
.conv-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 10px;
  border-radius: var(--radius); cursor: pointer; transition: background .15s; position: relative;
}
.conv-item:hover { background: var(--surface-2); }
.conv-item .avatar-wrap { position: relative; }
.conv-item .avatar-wrap .dot { position: absolute; bottom: 1px; right: 1px; width: 11px; height: 11px; border: 2px solid var(--bg); }
.conv-mid { flex: 1; min-width: 0; }
.conv-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.conv-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-preview { font-size: 13.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.conv-preview .tick { margin-right: 3px; color: var(--read-color); }
.conv-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.conv-time { font-size: 11.5px; color: var(--text-faint); }
.conv-muted .conv-preview, .conv-muted .conv-time { color: var(--text-faint); }

/* ============================================================
   CHAT VIEW
   ============================================================ */
.chat { display: flex; flex-direction: column; height: 100%; }
.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--surface); border-bottom: 1px solid var(--border); flex: none;
}
.chat-header .info { flex: 1; min-width: 0; }
.chat-header .name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 7px; }
.chat-header .status { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
.chat-header .status.online { color: var(--online); }
@media (min-width: 880px) {
  .chat-back { display: none; }
}

.messages {
  flex: 1; overflow-y: auto; padding: 16px 14px 8px;
  display: flex; flex-direction: column;
  background-image:
    radial-gradient(700px 300px at 80% 0%, rgba(91,95,239,.06), transparent 60%),
    radial-gradient(600px 300px at 10% 100%, rgba(34,211,238,.05), transparent 60%);
}
.msg-group { display: flex; margin-bottom: 10px; }
.msg-group.in { justify-content: flex-start; }
.msg-group.out { justify-content: flex-end; }
.msg-row { max-width: 78%; display: flex; flex-direction: column; animation: msgIn .18s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.bubble {
  padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.42;
  word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
  position: relative;
}
.msg-group.in .bubble { background: var(--bubble-in); color: var(--bubble-in-text); border-bottom-left-radius: 6px; }
.msg-group.out .bubble { background: var(--gradient); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 3px 10px rgba(91,95,239,.25); }
.msg-meta {
  display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-faint);
  margin-top: 3px; padding: 0 4px; user-select: none;
}
.msg-group.out .msg-meta { justify-content: flex-end; }
.tick { font-size: 13px; line-height: 1; }
.tick.sent { color: var(--text-faint); }
.tick.delivered { color: var(--text-faint); }
.tick.read { color: var(--read-color); }

.bubble.image { padding: 5px; background: var(--surface-2); border-bottom-left-radius: 6px; }
.msg-group.out .bubble.image { background: var(--surface-2); box-shadow: none; }
.bubble.image img { border-radius: 13px; max-width: 250px; max-height: 320px; cursor: zoom-in; object-fit: cover; }
.bubble .img-progress { width: 250px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); font-size: 13px; }
.progress-track { width: 160px; height: 6px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gradient); width: 0%; transition: width .2s; }
.msg-failed { border: 1.5px solid var(--danger) !important; }
.msg-retry { margin-top: 4px; align-self: flex-end; font-size: 12px; color: var(--danger); font-weight: 600; display: flex; align-items: center; gap: 5px; }

.day-divider { text-align: center; margin: 14px 0 10px; }
.day-divider span {
  font-size: 11.5px; font-weight: 700; color: var(--text-dim);
  background: var(--surface-2); padding: 5px 12px; border-radius: 999px;
}
.typing-bubble {
  display: inline-flex; gap: 4px; align-items: center;
  background: var(--bubble-in); border-radius: 18px; border-bottom-left-radius: 6px;
  padding: 13px 16px; width: fit-content;
}
.typing-bubble i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); animation: typingBounce 1.2s infinite; }
.typing-bubble i:nth-child(2) { animation-delay: .15s; }
.typing-bubble i:nth-child(3) { animation-delay: .3s; }
@keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

/* ---------- composer ---------- */
.composer {
  flex: none; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--border);
}
.composer textarea {
  flex: 1; resize: none; border: none; outline: none; background: var(--input-bg);
  border-radius: 22px; padding: 11px 16px; font-size: 15px; line-height: 1.4;
  max-height: 120px; min-height: 44px;
}
.composer textarea:focus { background: var(--surface-2); }
.composer .icon-btn { flex: none; color: var(--text-dim); }
.composer .icon-btn.send { background: var(--gradient); color: #fff; width: 44px; height: 44px; }
.composer .icon-btn.send:disabled { opacity: .5; }

/* ============================================================
   PEOPLE
   ============================================================ */
.search-bar { position: relative; margin-bottom: 14px; }
.search-bar svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-faint); }
.search-bar .input { padding-left: 40px; }
.section-title {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-faint); margin: 18px 4px 8px;
}
.user-row {
  display: flex; align-items: center; gap: 12px; padding: 10px;
  border-radius: var(--radius); cursor: default;
}
.user-row .avatar-wrap { position: relative; }
.user-row .avatar-wrap .dot { position: absolute; bottom: 1px; right: 1px; width: 11px; height: 11px; border: 2px solid var(--bg); }
.user-info { flex: 1; min-width: 0; }
.user-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-actions { display: flex; gap: 6px; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  color: var(--text-dim); background: var(--surface-2); padding: 5px 11px; border-radius: 999px;
}

/* ---- avatar chooser (9 built-ins + upload) ---- */
.avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.avatar-option {
  aspect-ratio: 1; border-radius: 50%; overflow: hidden; padding: 0;
  border: 2.5px solid var(--surface-3); background: none;
  transition: transform .15s, border-color .2s, box-shadow .2s;
}
.avatar-option img { width: 100%; height: 100%; object-fit: cover; }
.avatar-option:hover, .avatar-option:focus-visible { border-color: var(--primary); transform: scale(1.06); box-shadow: 0 6px 18px rgba(91,95,239,.35); }

/* ---- friend profile modal ---- */
.contact-row { cursor: pointer; }
.contact-row:hover { background: var(--surface-2); }
.friend-profile { text-align: center; padding: 4px 0 8px; }
.fp-avatar { position: relative; width: 110px; height: 110px; margin: 0 auto 12px; }
.fp-avatar .avatar { width: 110px; height: 110px; font-size: 42px; }
.fp-dot { position: absolute; bottom: 4px; right: 4px; width: 16px; height: 16px; border: 3px solid var(--surface); }
.fp-name { font-size: 19px; font-weight: 700; color: var(--text); }
.fp-status { font-size: 13px; color: var(--text-faint); margin-top: 3px; }
.fp-status.online { color: var(--online); font-weight: 600; }
.fp-email { font-size: 13.5px; color: var(--text-dim); margin-top: 6px; word-break: break-all; }
.fp-bio { font-size: 13.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; max-width: 300px; margin-left: auto; margin-right: auto; }
.fp-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.fp-actions .btn { flex: 1; min-width: 120px; }
.btn-danger-ghost { background: var(--danger-soft); color: var(--danger); }
.btn-danger-ghost:hover { background: rgba(239,68,68,.25); }

/* ============================================================
   NEWS FEED
   ============================================================ */
.feed { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
.feed-composer {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px;
}
.feed-input {
  flex: 1; resize: none; border: none; outline: none; background: transparent;
  font-size: 15px; line-height: 1.45; max-height: 120px;
}
.feed-input:focus { background: transparent; }
.feed-preview { position: relative; margin-top: 10px; }
.feed-preview img { max-height: 240px; border-radius: var(--radius); object-fit: cover; width: 100%; }
.feed-preview .icon-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; }
.feed-composer-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.feed-composer-actions .spacer { flex: 1; }

.feed-list { display: flex; flex-direction: column; gap: 12px; }
.post-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px 14px;
}
.post-head { display: flex; align-items: center; gap: 10px; }
.post-author { min-width: 0; }
.post-name { font-weight: 700; font-size: 14.5px; color: var(--text); }
.post-time { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
.post-body { font-size: 15px; line-height: 1.55; margin-top: 10px; white-space: pre-wrap; word-wrap: break-word; }
.post-image { margin-top: 10px; }
.post-image img { width: 100%; max-height: 360px; object-fit: cover; border-radius: var(--radius); cursor: zoom-in; }
.post-actions { display: flex; gap: 6px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
.post-action {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
  border-radius: 999px; color: var(--text-dim); font-size: 13.5px; font-weight: 600;
  transition: background .15s, color .15s;
}
.post-action svg { width: 17px; height: 17px; }
.post-action:hover { background: var(--surface-2); color: var(--text); }
.post-action.liked { color: #ff2d55; }
.post-action.liked svg { fill: #ff2d55; }

.post-comments { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.comment { display: flex; gap: 8px; align-items: flex-start; }
.comment-bubble { background: var(--surface-2); border-radius: 14px; padding: 7px 11px; font-size: 13.5px; line-height: 1.45; }
.comment-name { font-weight: 700; }
.comment-input { font-size: 13.5px; padding: 9px 13px; }

/* ============================================================
   CALLS
   ============================================================ */
.call-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius); }
.call-item:hover { background: var(--surface-2); }
.call-arrow { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.call-arrow svg { width: 18px; height: 18px; }
.call-arrow.out { background: var(--primary-soft); color: var(--primary); }
.call-arrow.in { background: var(--surface-2); color: var(--text-dim); }
.call-arrow.missed { background: var(--danger-soft); color: var(--danger); }
.call-info { flex: 1; min-width: 0; }
.call-name { font-weight: 600; font-size: 15px; }
.call-name .missed-tag { color: var(--danger); font-size: 12.5px; margin-left: 6px; }
.call-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

/* ============================================================
   PROFILE
   ============================================================ */
.profile-hero { display: flex; flex-direction: column; align-items: center; padding: 26px 16px 20px; }
.profile-hero .avatar { cursor: pointer; }
.avatar-edit { position: relative; }
.avatar-edit .camera-chip {
  position: absolute; bottom: 2px; right: 2px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--gradient); display: flex; align-items: center; justify-content: center;
  border: 2.5px solid var(--bg);
}
.avatar-edit .camera-chip svg { width: 15px; height: 15px; color: #fff; }
.profile-name { font-size: 20px; font-weight: 700; margin-top: 14px; }
.profile-email { font-size: 13.5px; color: var(--text-dim); margin-top: 3px; }
.profile-bio { font-size: 14px; color: var(--text-dim); margin-top: 8px; text-align: center; max-width: 320px; }
.settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin: 0 14px 16px; }
.settings-group .set-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); padding: 14px 16px 6px; }
.set-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--border); cursor: pointer; }
.set-row:first-child { border-top: none; }
.set-row:hover { background: var(--surface-2); }
.set-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
.set-icon svg { width: 19px; height: 19px; }
.set-icon.primary { background: var(--primary-soft); color: var(--primary); }
.set-icon.accent { background: rgba(34,211,238,.15); color: var(--accent); }
.set-icon.danger { background: var(--danger-soft); color: var(--danger); }
.set-label { flex: 1; font-size: 15px; font-weight: 500; }
.set-sub { font-size: 12.5px; color: var(--text-faint); margin-top: 1px; }
.set-value { color: var(--text-dim); font-size: 14px; }

/* toggle switch */
.switch { width: 46px; height: 27px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.switch.on { background: var(--primary); }
.switch.on::after { transform: translateX(19px); }

/* ============================================================
   MODALS / SHEETS
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: var(--overlay); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 400px; background: var(--surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden;
  animation: rise .25s ease; max-height: 85vh; display: flex; flex-direction: column;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.modal-header h3 { font-size: 17px; }
.modal-body { padding: 8px 18px 18px; overflow-y: auto; }
.modal .list { max-height: 320px; overflow-y: auto; }
.sheet { border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-width: none; animation: sheetUp .28s cubic-bezier(.4,0,.2,1); }
@keyframes sheetUp { from { transform: translateY(60%); } to { transform: none; } }
.sheet .modal-body { padding-bottom: 26px; }

/* fullscreen image viewer */
.viewer {
  position: fixed; inset: 0; z-index: 100; background: rgba(2,3,12,.94);
  display: flex; align-items: center; justify-content: center; animation: fadeIn .2s;
}
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer .close { position: absolute; top: 16px; right: 16px; }

/* ============================================================
   TOASTS
   ============================================================ */
#toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 15px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); font-size: 14px; color: var(--text);
  animation: toastIn .25s ease; pointer-events: auto;
}
.toast.out { animation: toastOut .3s ease forwards; }
.toast .t-icon { flex: none; }
.toast.info .t-icon { color: var(--primary); }
.toast.success .t-icon { color: var(--online); }
.toast.error .t-icon { color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

/* ============================================================
   CALL UI
   ============================================================ */
.call-screen {
  position: fixed; inset: 0; z-index: 110; background: #070a17; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  animation: fadeIn .25s ease;
}
.call-remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0a0d1c; }
.call-ringing-bg {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
.ring-avatar { width: 130px; height: 130px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px rgba(91,95,239,.35), 0 0 70px rgba(91,95,239,.5); animation: ringPulse 1.8s infinite; }
@keyframes ringPulse { 0%,100% { box-shadow: 0 0 0 6px rgba(91,95,239,.35), 0 0 50px rgba(91,95,239,.45); } 50% { box-shadow: 0 0 0 12px rgba(91,95,239,.12), 0 0 80px rgba(91,95,239,.6); } }
.call-status { font-size: 17px; font-weight: 600; }
.call-timer { font-size: 15px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
.call-local-preview {
  position: absolute; top: 16px; right: 16px; width: 106px; height: 150px; border-radius: 16px;
  overflow: hidden; background: #000; z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  border: 1.5px solid rgba(255,255,255,.25);
}
.call-local-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.call-local-preview.hidden { display: none; }
.call-controls { display: flex; align-items: center; gap: 18px; position: relative; z-index: 6; }
.call-btn {
  width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14); color: #fff; transition: transform .12s, background .2s;
}
.call-btn:active { transform: scale(.93); }
.call-btn svg { width: 26px; height: 26px; }
.call-btn.off { background: rgba(255,255,255,.3); }
.call-btn.end { background: var(--danger); }
.call-btn.accept { background: var(--online); width: 66px; height: 66px; }
.call-btn.decline { background: var(--danger); width: 66px; height: 66px; }
.call-btn.small { width: 46px; height: 46px; }
.call-btn.small svg { width: 20px; height: 20px; }
.call-top-info { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 5; padding-top: 20px; }
.call-top-info .avatar-lg { box-shadow: 0 8px 30px rgba(0,0,0,.4); }

/* ============================================================
   CONNECTION BANNER
   ============================================================ */
.offline-banner {
  position: sticky; top: 0; z-index: 20; background: rgba(239,68,68,.9); color: #fff;
  font-size: 13px; font-weight: 600; text-align: center; padding: 8px 12px;
  animation: fadeIn .25s;
}

/* ============================================================
   DESKTOP (≥ 880px): two-pane layout
   ============================================================ */
@media (min-width: 880px) {
  .shell { flex-direction: row; }
  .col-list { width: 372px; border-right: 1px solid var(--border); flex: none; }
  .col-chat { display: flex; position: static; transform: none; flex: 1; transition: none; visibility: visible; pointer-events: auto; }
  .bottom-nav { display: none; }
  .tabs { display: flex; flex-direction: column; padding: 8px 10px; gap: 2px; }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 14px; font-size: 14px; border-radius: var(--radius); }
  .tab svg { width: 21px; height: 21px; }
  .tab .badge { position: static; margin-left: auto; }
  .tab-content { padding-bottom: 16px; }
  .list-header { padding: 18px 18px 10px; }
  .list-header .brand img { width: 38px; height: 38px; }
  .list-header .brand h1 { font-size: 21px; }
  .chat-empty {
    position: relative; flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 30px; overflow: hidden; color: var(--text-dim);
    background:
      radial-gradient(820px 520px at 18% -12%, rgba(91,95,239,.20), transparent 60%),
      radial-gradient(720px 520px at 108% 112%, rgba(34,211,238,.16), transparent 60%),
      var(--chat-bg);
  }
  .chat-empty::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(91,95,239,.07) 50%, rgba(34,211,238,.06) 52%, transparent 70%);
    background-size: 240% 100%; animation: ceShine 9s linear infinite;
  }
  @keyframes ceShine { to { background-position: -240% 0; } }

  .chat-empty h2 { color: var(--text); font-size: 22px; position: relative; z-index: 2; margin: 4px 0 0; }
  .chat-empty p { max-width: 330px; font-size: 14px; line-height: 1.65; position: relative; z-index: 2; margin: 0 0 6px; }
  .chat-empty .btn { position: relative; z-index: 2; }

  /* floating bubbles */
  .ce-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  .ce-bubble {
    position: absolute; bottom: -60px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.12), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.07);
    animation: ceFloat linear infinite;
  }
  .ce-bubble.b1 { left: 7%;  width: 58px; height: 58px; animation-duration: 15s; }
  .ce-bubble.b2 { left: 21%; width: 24px; height: 24px; animation-duration: 19s; animation-delay: 3s; }
  .ce-bubble.b3 { left: 44%; width: 40px; height: 40px; animation-duration: 12s; animation-delay: 6s; }
  .ce-bubble.b4 { left: 66%; width: 28px; height: 28px; animation-duration: 21s; animation-delay: 2s; }
  .ce-bubble.b5 { left: 84%; width: 52px; height: 52px; animation-duration: 17s; animation-delay: 8s; }
  @keyframes ceFloat {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    8%   { opacity: .85; }
    100% { transform: translateY(-115vh) scale(1.18); opacity: 0; }
  }

  /* logo stage: pulsing rings + breathing logo + EKG */
  .ce-stage { position: relative; z-index: 2; width: 210px; height: 190px; display: flex; align-items: center; justify-content: center; }
  .ce-logo {
    width: 96px; height: 96px; border-radius: 28px; position: relative; z-index: 2;
    box-shadow: 0 18px 52px rgba(91,95,239,.5), 0 0 0 6px rgba(91,95,239,.12);
    animation: ceBreathe 3.4s ease-in-out infinite;
  }
  @keyframes ceBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .ce-rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ce-ring {
    position: absolute; width: 118px; height: 118px; border-radius: 50%;
    border: 2px solid rgba(91,95,239,.5);
    animation: ceRing 3.2s cubic-bezier(.2,.6,.35,1) infinite;
  }
  .ce-ring:nth-child(2) { animation-delay: 1.07s; }
  .ce-ring:nth-child(3) { animation-delay: 2.14s; }
  @keyframes ceRing { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

  /* heartbeat line that draws itself */
  .ce-ekg { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); z-index: 1; }
  .ce-ekg path {
    fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 520; stroke-dashoffset: 520;
    animation: ceEkg 3.4s linear infinite;
    filter: drop-shadow(0 0 6px rgba(34,211,238,.65));
  }
  @keyframes ceEkg {
    0%   { stroke-dashoffset: 520; }
    55%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -520; }
  }
  .ce-ekg-dot { fill: var(--accent); animation: ceDot 3.4s linear infinite; }
  @keyframes ceDot {
    0%   { transform: translateX(-4px); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translateX(226px); opacity: 0; }

          el("button", { class: "btn btn-primary", text: "Find people", onclick: () => location.hash = "#/people" })
        ])
      ]),
      el("nav", { class: "bottom-nav" }, TABS.map(tabButton))
    ]);
    app.replaceChildren(shell);
  }
  function pulseBackground() {
    return el("div", { class: "bg-pulse", "aria-hidden": "true" }, [
      el("div", { class: "bg-pulse-stage" }, [
        el("div", { class: "bg-pulse-rings" }, [
          el("span", { class: "bg-pulse-ring" }),
          el("span", { class: "bg-pulse-ring" }),
          el("span", { class: "bg-pulse-ring" })
        ]),
        el("img", { class: "bg-pulse-logo", src: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22pcg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffb02e%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff4d6d%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3C!--%20speech%20bubble%20with%20tail%20--%3E%0A%20%20%3Cpath%20d%3D%22M32%205C17.8%205%206.3%2015.2%206.3%2027.8c0%207.8%204.1%2014.5%2010.3%2018.9L13.6%2059l13-5.4c1.8.3%203.6.5%205.4.5%2014.2%200%2025.7-10.2%2025.7-22.8S46.2%205%2032%205z%22%20fill%3D%22url(%23pcg)%22%2F%3E%0A%20%20%3C!--%20friendly%20worm%20(segmented%20curve)%20--%3E%0A%20%20%3Cg%20fill%3D%22%23ffffff%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2243%22%20cy%3D%2227%22%20r%3D%225.6%22%2F%3E%20%20%20%20%20%20%3C!--%20head%20--%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2236%22%20cy%3D%2233%22%20r%3D%225.0%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2229%22%20cy%3D%2238%22%20r%3D%224.4%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2223%22%20cy%3D%2242%22%20r%3D%223.8%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2217%22%20cy%3D%2245%22%20r%3D%223.2%22%2F%3E%20%20%20%20%20%20%3C!--%20tail%20--%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2245%22%20cy%3D%2225%22%20r%3D%221.5%22%20fill%3D%22%23ff2d55%22%2F%3E%20%20%20%3C!--%20eye%20--%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A", alt: "" }),
        el("div", {
          class: "bg-pulse-ekg",
          html: '<svg viewBox="0 0 240 48" width="200" height="36" aria-hidden="true"><path class="bg-pulse-ekg-path" d="M0 24 H64 L74 24 L80 10 L88 38 L94 24 H126 L134 24 L140 12 L148 36 L154 24 H240"/></svg>'
        })
      ])
    ]);
  }
  function tabButton(tab) {
    return el("button", { class: "tab", id: "tab-" + tab.id, "data-tab": tab.id, onclick: () => location.hash = "#/" + tab.id }, [
      el("span", { html: icon(tab.icon) }),
      el("span", { text: tab.label }),
      el("span", { class: "badge hidden", id: "badge-" + tab.id })
    ]);
  }
  function ensureShell() {
    if (!document.getElementById("shell")) renderShell();
  }
  function updateTabActive() {
    for (const t of TABS) {
      document.querySelectorAll(`.tab[data-tab="${t.id}"]`).forEach((btn) => btn.classList.toggle("active", state_default.view === t.id));
    }
    updateBadges();
  }
  function updateBadges() {
    const setBadge = (tabId, count) => {
      document.querySelectorAll("#badge-" + tabId).forEach((b) => {
        b.textContent = count > 99 ? "99+" : String(count);
        b.classList.toggle("hidden", count === 0);
      });
    };
    setBadge("chats", state_default.unreadTotal);
    setBadge("people", state_default.incomingRequests.length);
    const missed = state_default.calls.filter((c) => (c.status === "missed" || c.status === "unanswered") && c.direction === "incoming").length;
    setBadge("calls", missed);
  }
  function route() {
    const hash = location.hash || "#/";
    if (hash === "#/" || hash === "") {
      location.replace("#/chats");
      return;
    }
    if (hash.startsWith("#/reset")) {
      const token = new URLSearchParams(hash.split("?")[1] || "").get("token");
      renderAuthView({ mode: "reset", token });
      return;
    }
    if (["#/login", "#/register", "#/forgot"].includes(hash)) {
      if (hasSession() && state_default.me) {
        location.replace("#/chats");
      } else {
        renderAuthView({ mode: hash.slice(2) });
      }
      return;
    }
    if (hash.startsWith("#/chat/")) {
      if (!hasSession()) return renderAuthView();
      if (!state_default.me) return enterMain();
      const id = Number(hash.split("/")[2]);
      if (!Number.isInteger(id)) return location.replace("#/chats");
      ensureShell();
      set("view", "chats");
      updateTabActive();
      openChat(id);
      return;
    }
    const view = hash.slice(2);
    if (!TABS.some((t) => t.id === view)) {
      location.replace("#/chats");
      return;
    }
    if (!hasSession()) return renderAuthView();
    if (!state_default.me) return enterMain();
    ensureShell();
    set("view", view);
    updateTabActive();
    renderTab(view);
  }
  function renderTab(view) {
    const host = document.getElementById("tabContent");
    if (!host) return;
    if (view === "feed") {
      render5(host);
      refresh4();
    } else if (view === "chats") {
      render(host);
      refresh();
    } else if (view === "people") {
      render3(host);
      refresh3();
    } else if (view === "calls") {
      render2(host);
      refresh2();
    } else if (view === "profile") {
      render4(host);
    }
  }
  function refreshAll() {
    refresh();
    refresh3();
    refresh2();
    updateConn();
  }
  function updateConn() {
    const pill = document.getElementById("conn-pill");
    const label = document.getElementById("conn-label");
    if (!pill || !label) return;
    const offline = !navigator.onLine;
    const connected = isConnected() && navigator.onLine;
    pill.className = "conn-pill " + (offline ? "offline" : connected ? "connected" : "connecting");
    label.textContent = offline ? "Offline" : connected ? "Online" : "Reconnecting\u2026";
  }
  function wireSocket() {
    if (wired) return;
    wired = true;
    on("socket:connect", () => {
      set("socketConnected", true);
      updateConn();
      refreshAll();
    });
    on("socket:disconnect", () => {
      set("socketConnected", false);
      updateConn();
    });
    on("socket:error", () => updateConn());
    on("feed:new", (p) => {
      if (state_default.view === "feed") addPostLive(p.post);
    });
    on("presence", (p) => {
      trackPresence(p);
      draw();
      draw3();
      updateHeaderStatus();
    });
    on("message:new", (p) => {
      upsertConversation(p.conversation);
      if (isOpen(p.conversation.id)) {
        appendMessage(p.message);
        markReadIfActive();
        resetConversationUnread(p.conversation.id);
      } else {
        const name = p.conversation.user.displayName;
        if (state_default.soundsOn && !document.hasFocus()) playBlip();
        toast(`New message from ${name}`, "info", 2600);
        notify("PulseChat Messenger", `New message from ${name}`, `/chat/${p.conversation.id}`);
      }
      draw();
      updateBadges();
    });
    on("message:delivered", (p) => {
      applyMessageDelivered(p.conversationId, p.messageIds, p.at);
      updateReceipts(p.conversationId);
      draw();
    });
    on("message:read", (p) => {
      applyMessageRead(p.conversationId, p.byUserId, p.upToMessageId);
      updateReceipts(p.conversationId);
      draw();
      updateBadges();
    });
    on("typing", (p) => {
      if (isOpen(p.conversationId)) showTyping(p.userId);
    });
    on("contact:request", (p) => {
      addIncomingRequest(p.from);
      updateBadges();
      if (state_default.view === "people") refresh3();
      toast(`${p.from.displayName} sent you a friend request`, "info", 3500);
      notify("PulseChat Messenger", `${p.from.displayName} sent you a friend request`, "/people");
    });
    on("contact:accepted", (p) => {
      addContact({ ...p.contact, relation: "accepted" });
      if (state_default.view === "people") refresh3();
      toast(`${p.contact.displayName} accepted your friend request`, "success", 3500);
      notify("PulseChat Messenger", `${p.contact.displayName} accepted your request`, "/chats");
    });
    on("contact:declined", () => {
      if (state_default.view === "people") refresh3();
      toast("Your friend request was declined", "info");
    });
    on("contact:removed", (p) => {
      removeContact(p.userId);
      const conv2 = state_default.conversations.find((c) => c.user.id === p.userId);
      if (conv2 && isOpen(conv2.id)) closeChat();
      if (state_default.view === "people") refresh3();
      draw();
      updateBadges();
      toast("A contact was removed", "info");
    });
    on("call:incoming", (p) => onIncoming(p));
    on("call:accepted", (p) => onAccepted(p));
    on("call:declined", (p) => onDeclined(p));
    on("call:cancelled", (p) => onCancelled(p));
    on("call:timeout", (p) => onTimeout(p));
    on("call:unavailable", (p) => onUnavailable(p));
    on("call:ended", (p) => onEnded(p));
    on("call:error", (p) => onCallError(p));
    on("signal", (p) => onSignal(p));
    setInterval(() => refreshAuth(), 4 * 60 * 1e3);
  }
  boot();
})();
</script>
</body>
</html>
